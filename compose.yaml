services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: corndog
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-corndog_local_only}
      POSTGRES_DB: dunia_corndog
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - corndog_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corndog -d dunia_corndog"]
      interval: 3s
      retries: 10
volumes:
  corndog_pg:
